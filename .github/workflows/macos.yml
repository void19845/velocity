name: macOS

on:
  push:
    branches: [dev, stable]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler (universel arm64 + x86_64)
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Tests automatiques
        run: |
          Velocity.app/Contents/MacOS/velocity --test test.txt
          cat test.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Velocity-macOS
          path: Velocity-macOS.zip

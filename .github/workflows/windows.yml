name: Windows

on:
  push:
    branches: [dev, stable]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler (MSVC)
        shell: cmd
        run: build.bat

      - name: Tests automatiques
        shell: pwsh
        run: |
          $p = Start-Process .\velocity.exe -ArgumentList "--test","test.txt" -PassThru
          $p.WaitForExit(180000) | Out-Null
          if (-not $p.HasExited) { $p.Kill(); throw "--test : delai depasse" }
          Get-Content test.txt
          if ($p.ExitCode -ne 0) { throw "--test : code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Velocity-Windows
          path: velocity.exe

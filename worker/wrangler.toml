name = "velocity-lobby"
main = "src/index.js"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "RATINGS"
class_name = "Ratings"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

# mode CLASSE : classement (cotes, rapports de match) dans un Durable Object SQLite, gratuit sur le plan free
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Ratings"]

# Classement du mode CLASSE stocke dans D1 (base « leaderboard ») : toutes les copies du jeu lisent et ecrivent
# la meme table players. Schema : schema.sql (cree aussi automatiquement au premier appel).
# Consulter : npx wrangler d1 execute leaderboard --remote --command "SELECT name, mmr, played FROM players ORDER BY mmr DESC"
[[d1_databases]]
binding = "leaderboard"
database_name = "leaderboard"
database_id = "59a414f0-e230-4484-b437-e29c41b85f6b"

name = "velocity-lobby"
main = "src/index.js"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# classements (mode CLASSE, SPEEDRUN) : base D1, tables creees au premier usage (src/ratings.js, src/speedrun.js)
[[d1_databases]]
binding = "LEADERBOARD"
database_name = "leaderboard"
database_id = "59a414f0-e230-4484-b437-e29c41b85f6b"

# connexion Discord (src/discord.js) : identifiant public de l'application Discord ; le secret se met a part :
#   npx wrangler secret put DISCORD_CLIENT_SECRET
# redirection a declarer dans l'application : https://<worker>/auth/discord/callback
[vars]
DISCORD_CLIENT_ID = ""

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

# ancien classement dans un Durable Object SQLite, remplace par la base D1 ci-dessus
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Ratings"]

[[migrations]]
tag = "v3"
deleted_classes = ["Ratings"]
